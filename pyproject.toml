[project]
name = "uru-doctor"
version = "0.1.0"
description = "Diagnose, deduplicate and retitle Ubuntu Release Upgrader bugs from their upgrade logs"
readme = "README.md"
# Matching ubuntu-release-upgrader, which this exists to triage bugs for. Its
# debian/copyright declares GPL-2+ for everything except one imported test
# helper, and upstream's own files carry the "version 2 ... or (at your option)
# any later version" notice. Keeping the same terms is what allows code to move
# in either direction between the two.
#
# A PEP 639 SPDX expression rather than the deprecated "License ::" classifier,
# which must not be used alongside it.
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Simon Johnsson", email = "simon.johnsson@canonical.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    # The CLI frontend: not a library dependency, but the development
    # environment and the test suite span both packages.
    "uru-doctor-cli",
]

[tool.uv.sources]
uru-doctor-cli = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

# The library is the workspace root; the CLI frontend lives in cli/ and is the
# only member that may depend on typer, rich or httpx.
[tool.uv.workspace]
members = ["cli"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# Without this, mypy does not know that `Field(default, ge=...)` supplies a
# default, and every model with a constrained field reports missing arguments.
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests", "cli/tests"]
addopts = "-q"

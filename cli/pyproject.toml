[project]
name = "uru-doctor-cli"
version = "0.1.0"
description = "Command-line frontend for uru-doctor, including the read-only Launchpad client"
# The CLI shares the library's licence for the same reason the library does:
# keeping the terms aligned with ubuntu-release-upgrader is what allows code to
# move in either direction between the two. The LICENSE file itself lives at
# the repository root.
license = "GPL-2.0-or-later"
authors = [
    { name = "Simon Johnsson", email = "simon.johnsson@canonical.com" }
]
requires-python = ">=3.12"
dependencies = [
    "uru-doctor",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
]

[project.scripts]
uru-doctor = "uru_doctor_cli.cli:app"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
uru-doctor = { workspace = true }
